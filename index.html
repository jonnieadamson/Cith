<style>

body{background-color:#0e2a22;background-attachment:fixed;background-image:repeating-linear-gradient(0deg,rgba(176,34,43,.28) 0 14px,transparent 14px 40px,rgba(217,169,60,.16) 40px 43px,transparent 43px 80px),repeating-linear-gradient(90deg,rgba(176,34,43,.28) 0 14px,transparent 14px 40px,rgba(217,169,60,.16) 40px 43px,transparent 43px 80px),repeating-linear-gradient(90deg,rgba(10,20,50,.35) 0 28px,transparent 28px 80px)}

.card,.tv{background:var(--card);color:var(--ink);border:1px solid var(--gold);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 3px 10px rgba(0,0,0,.35)}

.pcard.lift{box-shadow:0 12px 26px rgba(0,0,0,.55);position:relative;z-index:5;border:2px solid var(--acc)}
.tvwrap{position:fixed;left:0;top:0;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;z-index:20}
.stage{display:flex;flex-direction:column;overflow:hidden}
.tvhd{display:flex;align-items:center;justify-content:space-between;gap:1em;color:#f6ecd2;margin-bottom:.5em}
.tvt2{font:700 1.5em Cinzel,Georgia,serif;color:var(--gold);white-space:nowrap}
.tvm{text-align:center;flex:1}
.tvr{white-space:nowrap}
.tvr .btn{opacity:.4;padding:.1em .5em;font-size:.7em;margin-left:.6em;background:var(--card)}
.tvbd{flex:1;min-height:0;display:grid}
.tvbd .tv{margin:0;padding:.5em .7em;overflow:hidden}
.tvcol{display:flex;flex-direction:column;gap:.8em;min-height:0;overflow:hidden}
.tvcol .tv{flex:0 0 auto}
.tvbd .tv .to{white-space:nowrap}
.sel{flex:1;min-width:0;padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:15px}
.lnk{font:13px ui-monospace,Menlo,monospace;word-break:break-all;background:#fff;padding:6px 8px;border-radius:8px;margin:6px 0}
/* contemporary Lindsay look */
:root{--card:#f6f8fd;--ink:#0f1630;--mute:#5b6280;--line:#dfe4f1;--acc:#c8283c;--gold:#7cc7a0;--navy:#12204f}
html,body{font-family:Outfit,system-ui,-apple-system,Segoe UI,sans-serif}
body{background-color:#12204f;background-attachment:fixed;background-image:linear-gradient(rgba(7,11,30,.6),rgba(7,11,30,.84)),repeating-linear-gradient(90deg,transparent 0 36px,rgba(27,102,70,.85) 36px 104px,transparent 104px 116px,rgba(200,40,60,.9) 116px 120px,transparent 120px 132px,rgba(240,240,240,.75) 132px 134px,transparent 134px 176px),repeating-linear-gradient(0deg,transparent 0 36px,rgba(27,102,70,.85) 36px 104px,transparent 104px 116px,rgba(200,40,60,.9) 116px 120px,transparent 120px 132px,rgba(240,240,240,.75) 132px 134px,transparent 134px 176px)}

main.tvm::before{display:none}
h1{display:flex;flex-direction:column;align-items:center;gap:4px}
.tvt2{display:flex;align-items:center;gap:.4em}
.tvbd .tv{background:rgba(8,14,36,.92);color:#fff;border:1px solid rgba(255,255,255,.28)}
.tvbd .tv th{color:#a9b8e6;font-size:.62em}

.tvbd .tv .mute{color:#a9b8e6}
h1,.tvt,.tvt2{font-family:Outfit,system-ui,sans-serif;font-weight:800;letter-spacing:-.01em}
h1{font-size:30px;color:#fff;text-shadow:none}
.sub{font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.7)}
.tvt2{color:#fff}
.btn,.chip,.sb,nav button{font-family:Outfit,system-ui,sans-serif}
nav button{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;backdrop-filter:blur(6px)}
nav button.on{background:var(--acc);border-color:var(--acc)}
.card,.tv{border-radius:20px;border:1px solid rgba(255,255,255,.55);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.btn{border-radius:14px}
input{border-radius:12px;border:1px solid var(--line)}
.ord{background:var(--navy);color:#fff}
.lead td{background:rgba(124,199,160,.3)}
.chip{border:1.5px solid var(--line)}
.chip.on{background:#e3ecff;border-color:var(--navy)}
.pts,.cn,.tot{font-family:Outfit,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.tvh .btn,.tvr .btn{background:var(--card)}
</style>

<main>
<h1>🎩 Cards in the Hat</h1>

</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){var C={R:'204,32,48',G:'24,118,70',B:'46,76,160'},L=[['G',48],['B',6],['G',6],['B',6],['G',6],['B',18],['R',48],['G',6],['R',8]],F=L.concat(L.slice().reverse().slice(1,-1)),k=0.8,x=0,st=[];
F.forEach(function(s){var b=x+s[1]*k;st.push('rgba('+C[s[0]]+',.66) '+x.toFixed(1)+'px '+b.toFixed(1)+'px');x=b});
var rg=function(d){return'repeating-linear-gradient('+d+'deg,'+st.join(',')+')'};
document.body.style.backgroundColor='#0d1530';document.body.style.backgroundImage='linear-gradient(rgba(6,10,26,.38),rgba(6,10,26,.62)),'+rg(90)+','+rg(0)})();
var ROUNDS=[
 {name:'Round 1',rule:'One card at a time'},
 {name:'Round 2',rule:'Two cards at a time'},
 {name:'Round 3',rule:'Three cards at a time'},
 {name:'Round 4',rule:'All six cards at once'}
];
var CATS=[[5,'In the hat'],[4,'On the brim'],[3,'Against the hat'],[2,'On the paper'],[1,'Part on paper'],[0,'Missed']];
var HASCL=!!(window.claude&&claude.use),NT=-1,NK=0,TVROLE=location.hash==='#tv',GOT=false,ROOM=null,OPEN=null,CONF=null;
try{TVROLE=TVROLE||localStorage.getItem('cith_tv')==='1'}catch(e){}
var S={players:[],view:'players',round:0};
try{var saved=JSON.parse(localStorage.getItem('cith')||'null');if(saved&&saved.players)S=saved}catch(e){}
if(S.view==='tv')S.view='board';
var SUITS=['♠ Spades','♥ Hearts','♦ Diamonds','♣ Clubs'];S.teams=SUITS.slice();S.players.forEach(function(p){if(!(p.t>=0&&p.t<4))p.t=-1;p.r.forEach(function(o){if(o[0]===undefined)o[0]=0})});
if(TVROLE)S={players:[],teams:[],view:'tv',round:0};

function blank(){return[0,1,2,3].map(function(){return{5:0,4:0,3:0,2:0,1:0,0:0}})}
function rp(p,r){var s=0;CATS.forEach(function(c){s+=c[0]*(p.r[r][c[0]]||0)});return s}
function used(p,r){var n=0;CATS.forEach(function(c){n+=p.r[r][c[0]]||0});return n}

function total(p,upto){var s=0;for(var i=0;i<=(upto===undefined?3:upto);i++)s+=rp(p,i);return s}

 var idx=S.players.map(function(p,i){return i});

}

 var a=[];S.players.forEach(function(p,i){if(!f||f(p))a.push({p:p,i:i,t:total(p)})});

}
function nav(){
 var v=[['players','👥','Players'],['r0','R1','Round 1'],['r1','R2','Round 2'],['r2','R3','Round 3'],['r3','R4','Round 4'],['board','🏆','Leaderboard'],['tv','📺','TV view']];
 var cur=S.view==='round'?'r'+S.round:S.view;
 document.getElementById('nav').innerHTML=v.map(function(x){return'<button data-v="'+x[0]+'" title="'+x[2]+'" aria-label="'+x[2]+'" class="'+(x[0]===cur?'on':'')+'">'+x[1]+'</button>'}).join('');
}
function teamRows(){
 var r=S.teams.map(function(n,i){var m=S.players.filter(function(p){return p.t===i}),t=m.reduce(function(s,p){return s+total(p)},0);return{n:n,c:m.length,t:t,avg:m.length?t/m.length:0}}).filter(function(x){return x.c>0});
 r.sort(function(a,b){return b.avg-a.avg});
 var rk=0;r.forEach(function(e,k){if(k===0||Math.abs(e.avg-r[k-1].avg)>1e-9)rk=k+1;e.rank=rk});
 return r;
}
function sg(p){return p.t>=0&&SUITS[p.t]?' <span style="color:'+(p.t===1||p.t===2?'#b0222b':'inherit')+'">'+SUITS[p.t][0]+'</span>':''}
function sn(n){return'<span style="color:'+(n[0]==='♥'||n[0]==='♦'?'#b0222b':'inherit')+'">'+esc(n)+'</span>'}
function tTbl(r){
 return'<table><colgroup><col style="width:9%"><col style="width:41%"><col style="width:16%"><col style="width:16%"><col style="width:18%"></colgroup><tr><th>#</th><th>Team</th><th>Avg</th><th>Players</th><th>Total</th></tr>'+r.map(function(e){var w=e.rank===1;return'<tr class="'+(w?'lead':'')+'"><td>'+(w?'🏆':e.rank)+'</td><td class="nm">'+sn(e.n)+'</td><td class="tot">'+e.avg.toFixed(1)+'</td><td>'+e.c+'</td><td>'+e.t+'</td></tr>'}).join('')+'</table>';
}
function tbl(a){
 return'<table><colgroup><col style="width:9%"><col style="width:31%"><col style="width:10%"><col style="width:10%"><col style="width:10%"><col style="width:10%"><col style="width:20%"></colgroup><tr><th>#</th><th>Player</th><th>R1</th><th>R2</th><th>R3</th><th>R4</th><th>Total</th></tr>'+a.map(function(e){
  var w=e.rank===1&&e.t>0;
  return'<tr class="'+(w?'lead':'')+'"><td>'+(w?'🏆':e.rank)+'</td><td class="nm">'+esc(e.p.name)+sg(e.p)+'</td>'+[0,1,2,3].map(function(r){return'<td>'+(!dn(e.p,r)&&!used(e.p,r)?'–':rp(e.p,r))+'</td>'}).join('')+'<td class="tot">'+e.t+'</td></tr>';
 }).join('')+'</table>';
}
function kTbl(a){return'<table><colgroup><col style="width:12%"><col style="width:58%"><col style="width:30%"></colgroup><tr><th>#</th><th>Kid</th><th>Total</th></tr>'+a.map(function(e){var w=e.rank===1&&e.t>0;return'<tr class="'+(w?'lead':'')+'"><td>'+(w?'🏆':e.rank)+'</td><td class="nm">'+esc(e.p.name)+sg(e.p)+'</td><td class="tot">'+e.t+'</td></tr>'}).join('')+'</table>'}
function need(n){var k=Math.ceil(n/5);return n+(n===1?' pt':' pts')+(k<=6?' · '+k+' 🎯':'')}
function lbHtml(rows,lab){return'<table><colgroup><col style="width:9%"><col style="width:28%"><col style="width:12%"><col style="width:15%"><col style="width:36%"></colgroup><tr><th>#</th><th>'+lab+'</th><th>Pts</th><th>Behind</th><th>To lead</th></tr>'+rows.map(function(r){return'<tr class="'+(r.top?'lead':'')+'"><td>'+r.rk+'</td><td class="nm">'+r.name+'</td><td class="tot">'+r.tot+'</td><td>'+r.beh+'</td><td class="to">'+r.to+'</td></tr>'}).join('')+'</table>'}
function tHtml(rows){return'<table><colgroup><col style="width:9%"><col style="width:35%"><col style="width:16%"><col style="width:18%"><col style="width:22%"></colgroup><tr><th>#</th><th>Team</th><th>Avg</th><th>Behind</th><th>Needs</th></tr>'+rows.map(function(r){return'<tr class="'+(r.top?'lead':'')+'"><td>'+r.rk+'</td><td class="nm">'+r.name+'</td><td class="tot">'+r.tot+'</td><td>'+r.beh+'</td><td class="to">'+r.to+'</td></tr>'}).join('')+'</table>'}
function pRows(a){var L=a.length?a[0].t:0,sc=a.filter(function(e){return e.rank>1})[0];return a.map(function(e){var top=e.rank===1;return{rk:top&&e.t>0?'🏆':e.rank,name:esc(e.p.name)+sg(e.p),tot:e.t,top:top,beh:top?(sc?'+'+(e.t-sc.t):'–'):'−'+(L-e.t),to:top?'👑 Leader':need(L-e.t+1)}})}
function tRows(r){var L=r.length?r[0].avg:0,sc=r.filter(function(e){return e.rank>1})[0];return r.map(function(e){var top=e.rank===1,x=Math.floor(L*e.c-e.t+1e-9)+1;return{rk:top?'🏆':e.rank,name:sn(e.n),tot:e.avg.toFixed(1),top:top,beh:top?(sc?'+'+(e.avg-sc.avg).toFixed(1):'–'):'−'+(L-e.avg).toFixed(1),to:top?'👑':'+'+x+(x===1?' pt':' pts')}})}
function fitTV(){
 var over=function(el){return[].some.call(el.querySelectorAll('td:not(.nm),th'),function(c){return c.scrollWidth>c.clientWidth+1})};
 [].forEach.call(document.querySelectorAll('.tvbd .tv'),function(el){var fs=parseFloat(getComputedStyle(el).fontSize)||16,g=0;while(over(el)&&fs>8&&g++<60){fs-=1;el.style.fontSize=fs+'px'}});
 [].forEach.call(document.querySelectorAll('.tvbd>.tv,.tvbd>.tvcol'),function(el){var fs=parseFloat(getComputedStyle(el).fontSize)||16,g=0;while(el.scrollHeight>el.clientHeight+1&&fs>8&&g++<80){fs-=1;el.style.fontSize=fs+'px'}});
}
function tvLand(){
 var W=Math.min(window.innerWidth,window.innerHeight*16/9),H=W*9/16,n=S.players.length,a=ranked(),
  o=order(S.round).filter(function(i){return !dn(S.players[i],S.round)}),

 var h='<div class="tvwrap"><div class="stage" style="width:'+W+'px;height:'+H+'px;padding:'+(H*0.022)+'px"><div class="tvhd" style="font-size:'+(H/34)+'px"><div class="tvt2">'+logo(H/20)+'<span>Cards in the Hat</span></div><div class="tvm">'+ROUNDS[S.round].name+' · '+ROUNDS[S.round].rule+'</div><div class="tvr">'+rt+'<button class="btn ghost" data-a="tvx">✕</button></div></div>';

function saveFile(name,data,btn){

 if(HASCL){claude.use('downloads').then(function(D){if(!D){plain(name,data);ok();return}return D.save({filename:name,data:data}).then(ok).catch(function(e){if(!e||e.code!=='declined')btn.textContent='Export not available here'})}).catch(function(){plain(name,data);ok()})}
